# --- Сайт МУП «Борисоглебские теплосети» ---

# Панель управления: не больше 30 запросов в минуту с одного адреса. Перебор
# паролей упирается в этот лимит, а сервер сайта вдобавок закрывает вход на
# 15 минут после 10 неверных паролей.
limit_req_zone $binary_remote_addr zone=teploseti_admin:1m rate=30r/m;
server {
    listen 80 default_server;
    server_name borisoglebskteplo.ru www.borisoglebskteplo.ru
                xn--90aafiborfewbhlfqfs.xn--p1ai www.xn--90aafiborfewbhlfqfs.xn--p1ai
                _;

    location / {
        return 301 https://borisoglebskteplo.ru$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name borisoglebskteplo.ru;

    ssl_certificate /etc/letsencrypt/live/borisoglebskteplo.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/borisoglebskteplo.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;

    # Браузер запоминает, что сюда можно только по HTTPS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Скрипты и стили — только свои. inline-стили нужны: в вёрстке есть style="..."
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;

    # Сжатие текста: стили и скрипты уходят в 4–5 раз меньше
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml application/xml text/xml text/plain;

    client_max_body_size 12M;

    location /admin {
        limit_req zone=teploseti_admin burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/admin {
        limit_req zone=teploseti_admin burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# www — на основной адрес: у поисковиков одна копия сайта, а не две
server {
    listen 443 ssl http2;
    server_name www.borisoglebskteplo.ru;

    ssl_certificate /etc/letsencrypt/live/borisoglebskteplo.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/borisoglebskteplo.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    return 301 https://borisoglebskteplo.ru$request_uri;
}

# --- Тестовый контур Теплобиллинга (за прокси, Caddy на 127.0.0.1:8081) ---
# Здесь только основа блока; полные настройки контура ведутся в репозитории Теплобиллинга.
server {
    server_name 200-169-176-28.sslip.io;

    client_max_body_size 64M;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/200-169-176-28.sslip.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/200-169-176-28.sslip.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = 200-169-176-28.sslip.io) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name 200-169-176-28.sslip.io;
    return 404; # managed by Certbot


}